stage3:
  input_dir: "/apollo_workspace/modules/air_mapping/data/stage2_graph_opt"
  output_dir: "/apollo_workspace/modules/air_mapping/data/stage3_graph_refine"
  map_name: "stage3_graph_refine"

graph_refine:
  # Stage3 continues from Stage2 UTM-local poses. Adjacent relative edges keep
  # local LIO/loop consistency; GPS priors deform the trajectory toward
  # smoothed Stage2 GPS anchors.
  lio_translation_sigma_m: 0.08
  lio_rotation_sigma_deg: 1.0
  # GPS priors are weighted from raw std_dev: information ~= 1 / std_dev^2.
  # gps_weight_scale is only a global multiplier after std_dev weighting.
  gps_weight_scale: 1.0
  min_gps_std_xy: 0.05
  min_gps_std_z: 0.05
  max_gps_info_xy: 400.0
  max_gps_info_z: 40.0
  use_gps_z: false
  # Only fuse very high precision GPS anchors. 0 disables this hard gate.
  max_fused_gps_std_xy: 0.03
  # Same-segment GPS anchors are treated as continuous support only when their
  # stage2 path gap is short. Larger gaps become candidate outage blocks.
  gps_support_max_anchor_gap_m: 20.0
  gps_boundary_ramp_distance_m: 15.0
  first_pose_prior_translation_sigma_m: 5.0
  first_pose_prior_rotation_sigma_deg: 10.0
  lio_huber_delta: 1.0
  gps_huber_delta: 2.0
  first_pose_prior_huber_delta: 1.0

  # Long GPS outage areas are optimized as rigid blocks. Each block is matched
  # against nearby GPS-supported submaps with ICP, then constrained as one
  # representative SE3 prior to prevent rubber-band deformation.
  enable_outage_blocks: true
  outage_min_keyframes: 8
  outage_min_length_m: 20.0
  # 0 means one continuous no-GPS outage is kept as one rigid block. Set a
  # positive value only when memory/runtime requires splitting very long gaps.
  outage_max_block_length_m: 0.0
  outage_support_overlap_keyframes: 5
  outage_support_radius_m: 180.0
  outage_source_voxel_size_m: 0.3
  outage_target_voxel_size_m: 0.3
  outage_icp_max_iterations: 50
  outage_icp_max_corr_dist_m: 2.0
  outage_icp_fitness_threshold: 1.0
  outage_icp_translation_sigma_m: 0.5
  outage_icp_rotation_sigma_deg: 3.0
  outage_icp_huber_delta: 1.0
  max_iterations: 80
  verbose: false

output:
  save_preview_map: true
  preview_voxel_size: 0.2
  preview_keyframe_step: 1
