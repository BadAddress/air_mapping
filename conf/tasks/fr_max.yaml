# Explicit task entry for the fr_max Helios-32 near-range LIO profile.
# It writes data/fr_max and never overwrites baseline slam_bin_top artifacts.

air_mapping:
  module_root: "/apollo_workspace/modules/air_mapping"
  active_vehicle: "fr_max"
  active_vehicle_config: "conf/vehicles/fr_max.yaml"
  data_root: "/apollo_workspace/modules/air_mapping/data"
  debug_root: "/apollo_workspace/modules/air_mapping/data/debug"
